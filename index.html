<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Relatórios mensais de redes sociais, tráfego pago e marketing do Grupo Master.">
<link rel="icon" type="image/png" href="img/master-symbol.png">
<title>Relatórios Grupo Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: sidebar fixa de marcas à esquerda + área de relatório com hero tingido pela marca e grid bento de cards escuros. */
:root{
  color-scheme:dark;
  --bg:#08080A; --bg-2:#0D0D10; --surface:#131316; --surface-2:#19191D; --surface-3:#202025;
  --line:rgba(255,255,255,.065); --line-2:rgba(255,255,255,.11);
  --fg:#F3F2EF; --fg-2:#A7A6AD; --fg-3:#6F6E76;
  --up:#62D49C; --down:#F2B45A;
  --a1:#248B95; --a2:#C9431F; --a-text:#62C3CC;
  --grad:linear-gradient(45deg,#248B95 0%,#7A6656 55%,#C9431F 100%);
  --f-display:"Familjen Grotesk","Geist",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r-lg:22px; --r-md:16px; --r-sm:10px;
  --side:264px;
}
body[data-brand="pratique"]{--a1:#CC3E27;--a2:#F07446;--a-text:#F38667;--grad:linear-gradient(120deg,#A9301D 0%,#CC3E27 45%,#F07446 100%)}
body[data-brand="impacto"]{--a1:#D42C11;--a2:#F38E22;--a-text:#F7A651;--grad:linear-gradient(120deg,#D42C11 0%,#E85C19 50%,#F38E22 100%)}
body[data-brand="master"]{--a1:#248B95;--a2:#C9431F;--a-text:#62C3CC;--grad:linear-gradient(45deg,#248B95 0%,#7A6656 55%,#C9431F 100%)}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a-text);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:500;letter-spacing:-.015em;margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--f-mono)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;height:100dvh;display:flex;flex-direction:column;gap:22px;padding:22px 16px;border-right:1px solid var(--line);background:linear-gradient(180deg,#0B0B0E,#08080A)}
.side-brand{display:flex;align-items:center;gap:10px;padding:4px 8px 6px}
.side-brand img{height:22px;width:auto}
.side-brand span{font:500 11px/1 var(--f-mono);color:var(--fg-3);letter-spacing:.08em;text-transform:uppercase;margin-left:auto}
.nav{display:flex;flex-direction:column;gap:18px;overflow:auto;min-height:0}
.nav-group{display:flex;flex-direction:column;gap:4px}
.nav-label{font:500 10.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);padding:0 10px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:12px;border:1px solid transparent;background:none;text-align:left;cursor:pointer;transition:background .15s,border-color .15s}
.nav-item:hover{background:rgba(255,255,255,.03)}
.nav-item .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);flex:none;position:relative}
.nav-item .ico img{width:15px;height:auto;max-height:18px}
.nav-item .txt{display:flex;flex-direction:column;min-width:0}
.nav-item .t1{font-weight:500;font-size:13.5px;line-height:1.25}
.nav-item .t2{font-size:11.5px;color:var(--fg-3);line-height:1.3}
.nav-item .st{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--fg-3);opacity:.5;flex:none}
.nav-item .st.on{background:var(--ndot,#fff);opacity:1;box-shadow:0 0 10px var(--ndot,#fff)}
.nav-item[aria-current="page"]{background:var(--surface);border-color:var(--line-2)}
.nav-item[aria-current="page"] .ico{border-color:transparent;background:linear-gradient(var(--surface-2),var(--surface-2)) padding-box,var(--ngrad) border-box;box-shadow:0 0 18px -4px var(--nglow)}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:11.5px;color:var(--fg-3);line-height:1.45}

.main{min-width:0;position:relative}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,3.2vw,40px);padding-block:0 72px}

/* mobile nav */
.mnav{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mnav{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;gap:8px;overflow-x:auto;padding:12px 16px;background:rgba(8,8,10,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);scrollbar-width:none}
  .mnav::-webkit-scrollbar{display:none}
  .mnav button{flex:none;display:flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;white-space:nowrap;cursor:pointer}
  .mnav button img{height:14px;width:auto}
  .mnav button[aria-current="page"]{border-color:transparent;background:linear-gradient(var(--surface-2),var(--surface-2)) padding-box,var(--grad) border-box}
}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);isolation:isolate}
.hero::before{content:"";position:absolute;inset:-40% -10% auto -10%;height:150%;background:radial-gradient(60% 55% at 22% 0%,color-mix(in oklab,var(--a1) 34%,transparent),transparent 70%),radial-gradient(40% 50% at 85% 10%,color-mix(in oklab,var(--a2) 22%,transparent),transparent 70%);z-index:-2;pointer-events:none}
.hero .arc{position:absolute;right:-180px;bottom:-330px;width:720px;aspect-ratio:1;border-radius:50%;border:56px solid transparent;background:var(--grad) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box exclude,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) padding-box exclude,linear-gradient(#000 0 0);opacity:.42;z-index:-1;pointer-events:none;filter:saturate(1.1)}
.hero .arc.b{right:-60px;bottom:-250px;width:560px;border-width:2px;opacity:.35}
.hero .arc.c{right:-300px;bottom:-450px;width:960px;border-width:1px;opacity:.25}
.hero-in{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,3.2vw,40px);padding-block:34px 30px;display:flex;flex-direction:column;gap:22px}
.hero-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hero-logo{height:28px;width:auto;max-width:240px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 7px;border-radius:999px;border:1px solid var(--line-2);background:rgba(20,20,23,.7);backdrop-filter:blur(8px);font-size:12px;color:var(--fg-2);white-space:nowrap}
.chip .pi{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:var(--surface-3)}
.chip .pi svg{width:13px;height:13px}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--a-text);box-shadow:0 0 8px var(--a1)}
.hero h1{font-size:clamp(30px,4.4vw,50px);line-height:1.04;font-weight:400;max-width:20ch}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lede{color:var(--fg-2);max-width:68ch;font-size:15px}
.hero-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.months{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.months .lbl{font:500 10.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);margin-right:4px}
.mbtn{padding:7px 13px;border-radius:999px;border:1px solid var(--line-2);background:rgba(20,20,23,.6);font-size:12.5px;cursor:pointer;color:var(--fg-2)}
.mbtn[aria-pressed="true"]{color:var(--fg);border-color:transparent;background:linear-gradient(#17171B,#17171B) padding-box,var(--grad) border-box;box-shadow:0 0 20px -6px var(--a1)}
.mbtn[disabled]{opacity:.45;cursor:default}
.btn-pdf{display:inline-flex;align-items:center;gap:10px;padding:10px 16px 10px 14px;border-radius:999px;border:0;cursor:pointer;font-weight:500;font-size:13.5px;color:#140806;background:var(--grad);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 8px 30px -8px var(--a1),0 0 22px -6px var(--a2);transition:transform .15s,box-shadow .15s}
body[data-brand="master"] .btn-pdf{color:#fff}
.btn-pdf:hover{transform:translateY(-1px)}
.btn-pdf svg{width:16px;height:16px}
.btn-pdf[disabled]{background:var(--surface-2);color:var(--fg-3);box-shadow:0 0 0 1px var(--line-2) inset;cursor:not-allowed;transform:none}
.meta-line{display:flex;gap:8px 18px;flex-wrap:wrap;font-size:12px;color:var(--fg-3)}
.meta-line b{font-weight:500;color:var(--fg-2)}

/* subnav */
.subnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:rgba(8,8,10,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.subnav-in{max-width:1180px;margin:0 auto;padding:10px clamp(16px,3.2vw,40px);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.subnav-in::-webkit-scrollbar{display:none}
.subnav a{flex:none;padding:6px 12px;border-radius:999px;font-size:12.5px;color:var(--fg-2);text-decoration:none;border:1px solid transparent}
.subnav a:hover{color:var(--fg);border-color:var(--line-2)}
@media (max-width:900px){.subnav{top:calc(env(safe-area-inset-top,0px) + 57px)}}

/* ---------- sections ---------- */
.sec{padding-top:56px;scroll-margin-top:70px}
.eyebrow{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:14px}
.eyebrow i{display:block;height:1px;width:56px;background:linear-gradient(90deg,transparent,var(--line-2));position:relative}
.eyebrow i:last-child{background:linear-gradient(90deg,var(--line-2),transparent)}
.eyebrow i::after{content:"";position:absolute;top:-2.5px;width:6px;height:6px;transform:rotate(45deg);background:var(--fg-3)}
.eyebrow i:first-child::after{right:-3px}.eyebrow i:last-child::after{left:-3px}
.eyebrow span{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--bg-2);font:500 11px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-2)}
.eyebrow span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--a-text);box-shadow:0 0 8px var(--a1)}
.sec-h{text-align:center;font-size:clamp(22px,2.8vw,32px);line-height:1.15;max-width:30ch;margin:0 auto}
.sec-h span{color:var(--fg-3)}
.sec-lede{text-align:center;color:var(--fg-2);max-width:72ch;margin:12px auto 0;font-size:14.5px}

.grid{display:grid;gap:14px;margin-top:28px}
.g-12{grid-template-columns:repeat(12,minmax(0,1fr))}
.s-12{grid-column:span 12}.s-8{grid-column:span 8}.s-7{grid-column:span 7}.s-6{grid-column:span 6}.s-5{grid-column:span 5}.s-4{grid-column:span 4}.s-3{grid-column:span 3}
@media (max-width:1100px){.s-3{grid-column:span 6}.s-4{grid-column:span 6}}
@media (max-width:820px){.s-8,.s-7,.s-6,.s-5,.s-4{grid-column:span 12}}
@media (max-width:520px){.s-3{grid-column:span 6}.kpi{padding:16px}.kpi .k-v{font-size:26px}.kpi .k-l{font-size:12px;min-height:3.9em}.grid{gap:10px}}

.card{position:relative;background:linear-gradient(180deg,var(--surface),#111114);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;min-width:0;overflow:hidden}
.card.glass{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--surface)}
.card.glow::after{content:"";position:absolute;inset:auto -20% -60% -20%;height:90%;background:radial-gradient(50% 50% at 50% 50%,color-mix(in oklab,var(--a1) 22%,transparent),transparent 70%);pointer-events:none}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.card-h h3{font-size:17px;line-height:1.25}
.card-sub{color:var(--fg-2);font-size:13px;max-width:62ch}
.icobox{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;border:1px solid transparent;background:linear-gradient(var(--surface-2),var(--surface-2)) padding-box,var(--grad) border-box;box-shadow:0 0 22px -6px var(--a1)}
.icobox svg{width:16px;height:16px;stroke:var(--a-text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icobox.raw svg{stroke:none;width:18px;height:18px}

/* KPI tiles */
.kpi{display:flex;flex-direction:column;gap:10px}
.kpi .k-l{font-size:12.5px;color:var(--fg-2);line-height:1.3;min-height:2.6em}
.kpi .k-v{font:400 34px/1 var(--f-body);letter-spacing:-.025em}
.kpi .k-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--fg-3)}
.delta{display:inline-flex;align-items:center;gap:4px;padding:3px 8px 3px 6px;border-radius:999px;font:500 11.5px/1.2 var(--f-mono);border:1px solid}
.delta svg{width:11px;height:11px}
.delta.up{color:var(--up);border-color:color-mix(in oklab,var(--up) 35%,transparent);background:color-mix(in oklab,var(--up) 10%,transparent)}
.delta.down{color:var(--down);border-color:color-mix(in oklab,var(--down) 35%,transparent);background:color-mix(in oklab,var(--down) 10%,transparent)}
.delta.flat{color:var(--fg-2);border-color:var(--line-2)}
.kpi .bar2{display:grid;grid-template-columns:34px 1fr;gap:5px 8px;align-items:center;font:400 11px/1 var(--f-mono);color:var(--fg-3);margin-top:2px}
.kpi .bar2 i{display:block;height:5px;border-radius:3px;background:var(--surface-3)}
.kpi .bar2 i.cur{background:var(--grad);box-shadow:0 0 10px -2px var(--a1)}

/* headline tile */
.headline{display:flex;flex-direction:column;gap:16px;justify-content:space-between}
.headline .big{font:400 clamp(22px,2.6vw,28px)/1.22 var(--f-display);letter-spacing:-.01em;max-width:30ch}
.headline .big b{font-weight:500;color:var(--a-text)}
.stat-pair{display:flex;gap:28px;flex-wrap:wrap}
.stat-pair div{display:flex;flex-direction:column;gap:3px}
.stat-pair .v{font-size:26px;letter-spacing:-.02em}
.stat-pair .l{font-size:12px;color:var(--fg-3)}

.notes{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.notes li{display:grid;grid-template-columns:16px 1fr;gap:8px;font-size:13px;color:var(--fg-2)}
.notes li::before{content:"";width:6px;height:6px;margin-top:7px;border-radius:2px;transform:rotate(45deg);background:var(--fg-3)}
.notes.gap li::before{background:var(--down)}

.pillrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 13px 7px 9px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-size:12.5px;color:var(--fg-2)}
.pill svg{width:14px;height:14px;flex:none}
.pill.gap svg{stroke:var(--down)}

/* charts */
.chart{position:relative;width:100%;margin-top:14px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg-2);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;display:block}
.tip{position:fixed;z-index:50;pointer-events:none;min-width:150px;max-width:260px;padding:10px 12px;border-radius:12px;background:rgba(24,24,28,.96);border:1px solid var(--line-2);box-shadow:0 12px 40px rgba(0,0,0,.5);font-size:12px;color:var(--fg-2);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
.tip.on{opacity:1;transform:none}
.tip b{display:block;color:var(--fg);font-weight:500;font-size:12.5px;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:14px}
.tip .r span:last-child{color:var(--fg);font-family:var(--f-mono)}
.hbars{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.hb{display:grid;grid-template-columns:minmax(90px,140px) 1fr auto;gap:12px;align-items:center;font-size:12.5px}
.hb .n{color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .t{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:4px;background:var(--grad);box-shadow:0 0 12px -2px var(--a1)}
.hb .v{font-family:var(--f-mono);font-size:12px;color:var(--fg);min-width:52px;text-align:right}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin-top:14px}
.split i{display:block;height:100%}

/* tables */
.tbl-wrap{overflow-x:auto;margin-top:14px;border-radius:var(--r-md);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th{font:500 10.5px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);text-align:left;padding:12px 14px;background:var(--bg-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--fg-2)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.num{color:var(--fg)}
td .pt{color:var(--fg);font-weight:500;text-decoration:none;border-bottom:1px solid var(--line-2)}
td .pt:hover{border-color:var(--a-text)}
.rank{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--surface-3);font:500 12px/1 var(--f-mono);color:var(--fg)}
tr:first-child .rank{background:var(--grad);color:#fff;box-shadow:0 0 14px -3px var(--a1)}
.fmt{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);font-size:11.5px;color:var(--fg-2);white-space:nowrap}
.fmt i{width:6px;height:6px;border-radius:50%;background:var(--a1)}
.fmt.car i{background:transparent;border:1.5px solid var(--a-text)}

/* tabs inside card */
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--bg-2);border:1px solid var(--line);gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:12.5px;color:var(--fg-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--fg)}

/* lists */
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:820px){.twocol{grid-template-columns:1fr}}
.lst{display:flex;flex-direction:column;gap:12px;margin:14px 0 0;padding:0;list-style:none}
.lst li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:13.5px;color:var(--fg-2)}
.lst li b{color:var(--fg);font-weight:500}
.lst .mk{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;margin-top:1px}
.lst .mk svg{width:12px;height:12px;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lst.ok .mk{background:color-mix(in oklab,var(--up) 14%,transparent)}.lst.ok .mk svg{stroke:var(--up)}
.lst.warn .mk{background:color-mix(in oklab,var(--down) 14%,transparent)}.lst.warn .mk svg{stroke:var(--down)}

.gapbig{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:12px 18px;align-items:center;margin-top:18px}
.gapbig .n{font-size:clamp(28px,3.4vw,40px);letter-spacing:-.02em;line-height:1}
.gapbig .l{font-size:12.5px;color:var(--fg-2);max-width:20ch}
.gapbig .arrow{grid-column:1/-1;height:1px;background:var(--grad);position:relative;opacity:.8}
@media (max-width:620px){.gapbig{grid-template-columns:auto 1fr}}

/* recommendations */

const tip = $("#tip");
function showTip(html,x,y){tip.innerHTML=html;tip.classList.add("on");const r=tip.getBoundingClientRect();let L=x+14,T=y+14;if(L+r.width>innerWidth-8)L=x-r.width-14;if(T+r.height>innerHeight-8)T=y-r.height-14;tip.style.left=Math.max(8,L)+"px";tip.style.top=Math.max(8,T)+"px";}
function hideTip(){tip.classList.remove("on");}
function bindTips(root){
  root.querySelectorAll("[data-tip]").forEach(el=>{
    const h=()=>el.dataset.tip;
    el.addEventListener("pointermove",e=>showTip(h(),e.clientX,e.clientY));
    el.addEventListener("pointerleave",hideTip);
    el.addEventListener("focus",()=>{const r=el.getBoundingClientRect();showTip(h(),r.right,r.top);});
    el.addEventListener("blur",hideTip);
  });
}
const tipHTML = (title,rows)=>`<b>${esc(title)}</b>`+rows.map(([k,v])=>`<div class="r"><span>${k}</span><span>${v}</span></div>`).join("");

/* ---------- gráficos (SVG) ---------- */
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;const m=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return m*p;}

function drawPostBars(el,posts){
  const W=Math.max(300,el.clientWidth), H=Math.round(Math.min(320,Math.max(230,W*.42)));
  const m={t:26,r:8,b:46,l:44}, iw=W-m.l-m.r, ih=H-m.t-m.b;
  const max=niceMax(Math.max(...posts.map(p=>p.reach))*1.05), ticks=4;
  const bw=Math.min(54,iw/posts.length-10), step=iw/posts.length;
  const y=v=>m.t+ih-(v/max)*ih;
  let g=`<defs><linearGradient id="bg-r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--a2)"/><stop offset="1" stop-color="var(--a1)"/></linearGradient><filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter></defs>`;
  for(let i=0;i<=ticks;i++){const v=max/ticks*i,yy=y(v);g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}" stroke="rgba(255,255,255,${i?0.06:0.14})"/><text x="${m.l-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="#6F6E76" font-family="Geist Mono,monospace">${v>=1000?(v/1000).toLocaleString("pt-BR")+"k":v}</text>`;}
  const maxI=posts.reduce((a,p,i)=>p.reach>posts[a].reach?i:a,0);
  posts.forEach((p,i)=>{
    const cx=m.l+step*i+step/2, x=cx-bw/2, yy=y(p.reach), h=Math.max(2,m.t+ih-yy), r=Math.min(4,h/2);
    const path=`M${x},${m.t+ih} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+bw-r} Q${x+bw},${yy} ${x+bw},${yy+r} V${m.t+ih} Z`;
    const reel=p.f==="Reels";
    if(i===maxI) g+=`<path d="${path}" style="fill:var(--a1)" opacity=".55" filter="url(#gl)"/>`;
    g+= reel ? `<path d="${path}" fill="url(#bg-r)"/>` : `<path d="${path}" style="fill:var(--a1)" fill-opacity=".22"/><path d="${path}" fill="none" style="stroke:var(--a-text)" stroke-width="1.4" stroke-opacity=".9"/>`;
    g+=`<text x="${cx}" y="${H-m.b+18}" text-anchor="middle" font-size="11" fill="#A7A6AD" font-family="Geist Mono,monospace">${step<52?p.d.slice(0,2):p.d}</text>`;
    if(i===maxI||p.reach>=1000) g+=`<text x="${cx}" y="${yy-8}" text-anchor="middle" font-size="12" fill="#F3F2EF" font-family="Geist,sans-serif" font-weight="500">${fmtN(p.reach)}</text>`;
    const tipS=esc(tipHTML(p.t,[["Formato",p.f],["Data",p.d],["Alcance",fmtN(p.reach)],["Taxa de engaj.",fmtP(p.rate)]]));
    g+=`<rect x="${m.l+step*i+2}" y="${m.t}" width="${step-4}" height="${ih}" fill="transparent" data-tip="${tipS}" tabindex="0" aria-label="${esc(p.t)}, ${p.d}, alcance ${fmtN(p.reach)}"/>`;
  });
  g+=`<text x="${m.l}" y="${H-8}" font-size="11" fill="#6F6E76" font-family="Geist,sans-serif">${step<52?"Dia de publicação em setembro":"Data de publicação · setembro"}</text>`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Alcance por publicação em setembro">${g}</svg>`;
  bindTips(el);
}

function drawPairBars(el,rows,key,fmt,title){
  const W=Math.max(260,el.clientWidth), H=190, m={t:12,r:8,b:34,l:8}, iw=W-m.l-m.r, ih=H-m.t-m.b;
  const max=Math.max(...rows.flatMap(r=>[r.prev[key],r.cur[key]]))*1.18;
  const gw=iw/rows.length, bw=Math.min(40,gw/3.2);
  const y=v=>m.t+ih-(v/max)*ih;
  let g=`<line x1="${m.l}" x2="${W-m.r}" y1="${m.t+ih}" y2="${m.t+ih}" stroke="rgba(255,255,255,.14)"/>`;
  rows.forEach((r,i)=>{
    const cx=m.l+gw*i+gw/2;
    [["prev",-1],["cur",1]].forEach(([k,s])=>{
      const v=r[k][key], x0=cx+(s<0?-bw-1:1), yy=y(v), h=m.t+ih-yy, rr=Math.min(4,h/2);
      const path=`M${x0},${m.t+ih} V${yy+rr} Q${x0},${yy} ${x0+rr},${yy} H${x0+bw-rr} Q${x0+bw},${yy} ${x0+bw},${yy+rr} V${m.t+ih} Z`;
      g+= k==="cur" ? `<path d="${path}" style="fill:var(--a1)"/>` : `<path d="${path}" fill="#3A3A41"/>`;
      g+=`<text x="${x0+bw/2}" y="${yy-7}" text-anchor="middle" font-size="11.5" fill="${k==="cur"?"#F3F2EF":"#A7A6AD"}" font-family="Geist Mono,monospace">${fmt(v)}</text>`;
      g+=`<rect x="${x0-1}" y="${m.t}" width="${bw+2}" height="${ih}" fill="transparent" data-tip="${esc(tipHTML(r.f+" · "+(k==="cur"?"Setembro":"Agosto"),[["Posts",r[k].posts],[title,fmt(v)]]))}"/>`;
    });
    g+=`<text x="${cx}" y="${H-10}" text-anchor="middle" font-size="12" fill="#A7A6AD" font-family="Geist,sans-serif">${r.f}</text>`;
  });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} por formato, agosto e setembro">${g}</svg>`;
  bindTips(el);
}

/* ---------- PDF ---------- */
async function downloadPdf(pdf){
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads").catch(()=>null) : null;
  if(!dl){ const a=document.createElement("a"); a.href=pdf.path; a.download=pdf.name; document.body.appendChild(a); a.click(); a.remove(); toast("Baixando o PDF."); return; }
  try{
    const res = await fetch(pdf.path); if(!res.ok) throw {code:"missing"};
    const blob = await res.blob();
    await dl.save({filename:pdf.name,data:blob});
    toast("PDF salvo.");
  }catch(e){
    if(e && e.code==="declined") return;
    if(e && e.code==="rate_limited"){toast("Já existe um download aguardando confirmação.");return;}
    toast(e && e.code==="missing" ? "O PDF deste mês não foi encontrado." : "Não foi possível baixar o PDF agora.");
  }
}

/* comparação agosto (viral + demais) × setembro */
function drawViralCompare(el,V){
  const W=Math.max(300,el.clientWidth), narrow=W<560;
  const lw=narrow?0:120, H=narrow?190:150, m={t:narrow?26:10,r:10,b:26,l:lw};
  const iw=W-m.l-m.r, bh=narrow?26:30, gap=narrow?48:28;
  const max=V.aug.viral+V.aug.rest, x=v=>v/max*iw;
  const augAvg=Math.round(V.aug.rest/V.aug.restPosts), sepAvg=Math.round(V.sep.total/V.sep.posts);
  let g=`<defs><linearGradient id="vg" x1="0" x2="1"><stop offset="0" stop-color="var(--a1)"/><stop offset="1" stop-color="var(--a2)"/></linearGradient><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#232328"/><line x1="0" y1="0" x2="0" y2="7" stroke="#3B3B42" stroke-width="3"/></pattern></defs>`;
  const rowY=[m.t, m.t+bh+gap];
  const lab=(y,t)=> narrow ? `<text x="0" y="${y-8}" font-size="12" fill="#A7A6AD" font-family="Geist,sans-serif">${t}</text>` : `<text x="${lw-14}" y="${y+bh/2+4}" text-anchor="end" font-size="12.5" fill="#A7A6AD" font-family="Geist,sans-serif">${t}</text>`;
  // agosto
  let y=rowY[0]; g+=lab(y,"Agosto");
  const wr=x(V.aug.rest), wv=x(V.aug.viral);
  g+=`<rect x="${m.l}" y="${y}" width="${wr-1}" height="${bh}" rx="4" fill="#5A5A63" data-tip="${esc(tipHTML("Agosto · 5 posts normais",[["Alcance somado",fmtN(V.aug.rest)],["Média por post",fmtN(augAvg)]]))}"/>`;
  g+=`<rect x="${m.l+wr+1}" y="${y}" width="${wv-1}" height="${bh}" rx="4" fill="url(#hatch)" data-tip="${esc(tipHTML("Agosto · Reel viral de 10/08",[["Alcance",fmtN(V.aug.viral)],["Parte do mês","82%"]]))}"/>`;
  g+=`<text x="${m.l+wr+12}" y="${y+bh/2+4}" font-size="12" fill="#C9C8CE" font-family="Geist,sans-serif">1 Reel viral · ${fmtN(V.aug.viral)}</text>`;
  if(!narrow) g+=`<text x="${m.l+6}" y="${y+bh/2+4}" font-size="11.5" fill="#F3F2EF" font-family="Geist Mono,monospace">${fmtN(V.aug.rest)}</text>`;
  // setembro
  y=rowY[1]; g+=lab(y,"Setembro");
  const ws=x(V.sep.total);
  g+=`<rect x="${m.l}" y="${y}" width="${ws}" height="${bh}" rx="4" fill="url(#vg)" data-tip="${esc(tipHTML("Setembro · 8 posts",[["Alcance somado",fmtN(V.sep.total)],["Média por post",fmtN(sepAvg)]]))}"/>`;
  g+=`<text x="${m.l+ws+10}" y="${y+bh/2+4}" font-size="12" fill="#F3F2EF" font-family="Geist Mono,monospace">${fmtN(V.sep.total)}</text>`;
  const H2=rowY[1]+bh+m.b;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H2}" role="img" aria-label="Alcance somado dos posts: agosto ${fmtN(V.aug.rest+V.aug.viral)}, sendo ${fmtN(V.aug.viral)} de um Reel viral; setembro ${fmtN(V.sep.total)}">${g}</svg>`;
  bindTips(el);
}

function drawStackRows(el,V){
  const W=Math.max(300,el.clientWidth), narrow=W<560, lw=narrow?0:96, bh=narrow?26:30, gap=narrow?50:30, top=narrow?24:8;
  const iw=W-lw-12, max=Math.max(V.aug.total,V.sep.total), x=v=>v/max*iw;
  let g=`<defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="var(--a1)"/><stop offset="1" stop-color="var(--a2)"/></linearGradient><pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#232328"/><line x1="0" y1="0" x2="0" y2="7" stroke="#4A4A52" stroke-width="3"/></pattern></defs>`;
  [["Agosto",V.aug],["Setembro",V.sep]].forEach(([lab,d],i)=>{
    const y=top+i*(bh+gap);
    g+= narrow?`<text x="0" y="${y-8}" font-size="12" fill="#A7A6AD" font-family="Geist,sans-serif">${lab}</text>`:`<text x="${lw-14}" y="${y+bh/2+4}" text-anchor="end" font-size="12.5" fill="#A7A6AD" font-family="Geist,sans-serif">${lab}</text>`;
    const wr=x(d.rest), wv=x(d.viral);
    g+=`<rect x="${lw}" y="${y}" width="${Math.max(1,wr-1)}" height="${bh}" rx="4" fill="${i?"url(#sg)":"#5A5A63"}" data-tip="${esc(tipHTML(lab+" · demais dias",[["Visualizações",fmtN(d.rest)]]))}"/>`;
    g+=`<rect x="${lw+wr+1}" y="${y}" width="${Math.max(1,wv-1)}" height="${bh}" rx="4" fill="url(#hatch2)" data-tip="${esc(tipHTML(lab+" · "+d.vl,[["Visualizações",fmtN(d.viral)],["Parte do mês",Math.round(d.viral/d.total*100)+"%"]]))}"/>`;
    const tx=lw+wr+wv+10, inside=tx+90>W;
    g+=`<text x="${inside?lw+wr+wv-10:tx}" y="${y+bh/2+4}" text-anchor="${inside?"end":"start"}" font-size="12" fill="#F3F2EF" font-family="Geist Mono,monospace">${fmtN(d.total)}</text>`;
  });
  const H=top+2*bh+gap+10;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Visualizações no Instagram: agosto ${fmtN(V.aug.total)}, sendo ${fmtN(V.aug.viral)} em dias de pico de virais; setembro ${fmtN(V.sep.total)}">${g}</svg>`;
  bindTips(el);
}

function drawViewBars(el,posts){
  const W=Math.max(300,el.clientWidth), H=Math.round(Math.min(300,Math.max(220,W*.4)));
  const m={t:26,r:8,b:46,l:44}, iw=W-m.l-m.r, ih=H-m.t-m.b;
  const max=niceMax(Math.max(...posts.map(p=>p.reach))*1.05), step=iw/posts.length, bw=Math.min(54,step-10);
  const y=v=>m.t+ih-(v/max)*ih;
  let g=`<defs><linearGradient id="vb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--a2)"/><stop offset="1" stop-color="var(--a1)"/></linearGradient></defs>`;
  for(let i=0;i<=4;i++){const v=max/4*i,yy=y(v);g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${yy}" y2="${yy}" stroke="rgba(255,255,255,${i?0.06:0.14})"/><text x="${m.l-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="#6F6E76" font-family="Geist Mono,monospace">${v>=1000?(v/1000).toLocaleString("pt-BR")+"k":v}</text>`;}
  posts.forEach((p,i)=>{
    const cx=m.l+step*i+step/2, x=cx-bw/2, yy=y(p.reach), h=Math.max(2,m.t+ih-yy), r=Math.min(4,h/2);
    const path=`M${x},${m.t+ih} V${yy+r} Q${x},${yy} ${x+r},${yy} H${x+bw-r} Q${x+bw},${yy} ${x+bw},${yy+r} V${m.t+ih} Z`;
    g+= p.f==="Reels"?`<path d="${path}" fill="url(#vb)"/>`:`<path d="${path}" style="fill:var(--a1)" fill-opacity=".25"/><path d="${path}" fill="none" style="stroke:var(--a-text)" stroke-width="1.4"/>`;
    g+=`<text x="${cx}" y="${H-m.b+18}" text-anchor="middle" font-size="11" fill="#A7A6AD" font-family="Geist Mono,monospace">${step<52?p.d.slice(0,2):p.d}</text>`;
    if(p.reach>=1000&&(step>=52||p.reach===Math.max(...posts.map(q=>q.reach)))) g+=`<text x="${cx}" y="${yy-8}" text-anchor="middle" font-size="12" fill="#F3F2EF" font-family="Geist,sans-serif" font-weight="500">${p.reach>=100000?Math.round(p.reach/1000)+" mil":fmtN(p.reach)}</text>`;
    const rows=[["Formato",p.f],["Data",p.d],["Visualizações",fmtN(p.reach)]];
    g+=`<rect x="${m.l+step*i+2}" y="${m.t}" width="${step-4}" height="${ih}" fill="transparent" data-tip="${esc(tipHTML(p.t,rows))}" tabindex="0" aria-label="${esc(p.t)}, ${p.d}, ${fmtN(p.reach)} visualizações"/>`;
  });
  g+=`<text x="${m.l}" y="${H-8}" font-size="11" fill="#6F6E76" font-family="Geist,sans-serif">${step<52?"Dia de publicação em setembro":"Data de publicação · setembro"}</text>`;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Visualizações de cada post em setembro">${g}</svg>`;

/* tráfego pago: ligações por dia (Google) */
function drawDailyCalls(el,calls){
  const W=Math.max(300,el.clientWidth), narrow=W<560, H=narrow?166:190, pl=22, pr=6, pt=30, pb=26;
  const n=calls.length, cw=(W-pl-pr)/n, bw=Math.max(4,Math.min(16,cw*.58)), mx=3, ih=H-pt-pb;
  const y=v=>pt+ih-(v/mx)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ligações por dia em setembro"><defs><linearGradient id="gCall" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="var(--a1)"/><stop offset="1" stop-color="var(--a2)"/></linearGradient></defs>`;
  for(let t=0;t<=mx;t++){s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="rgba(255,255,255,${t?0.05:0.12})"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end" fill="var(--fg-3)" font-size="10.5" font-family="var(--f-mono)">${t}</text>`;}
  const half=pl+cw*15; s+=`<line x1="${half}" x2="${half}" y1="2" y2="${H-pb}" stroke="rgba(255,255,255,.14)" stroke-dasharray="3 4"/>`;
  calls.forEach((v,i)=>{const x=pl+cw*i+(cw-bw)/2;
    if(v>0) s+=`<rect x="${x}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" rx="${Math.min(4,bw/2)}" fill="url(#gCall)" data-tip="${esc(tipHTML(String(i+1).padStart(2,"0")+"/09",[["Ligações",v]]))}"/>`;
    else s+=`<circle cx="${x+bw/2}" cy="${y(0)-3}" r="1.6" fill="var(--fg-3)" opacity=".6"/>`;
    if(i===0||(i+1)%5===0) s+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" fill="var(--fg-3)" font-size="10.5" font-family="var(--f-mono)">${String(i+1).padStart(2,"0")}/09</text>`;
  });
  s+=`<text x="${half-6}" y="12" text-anchor="end" fill="var(--fg-3)" font-size="10.5">1ª quinzena · 4 dias</text><text x="${half+6}" y="12" fill="var(--fg-3)" font-size="10.5">2ª quinzena · 7 dias</text>`;
  el.innerHTML=s+"</svg>";
}

        <div><span class="aud-h">Gênero</span>
          <div class="split">${A.gender.map((x,i)=>`<i style="width:${x[1]}%;background:${["var(--a1)","var(--a2)"][i]}"></i>`).join("")}</div>
          <div class="legend">${A.gender.map((x,i)=>`<span><i style="background:${["var(--a1)","var(--a2)"][i]}"></i>${x[0]} ${fmtP(x[1])}</span>`).join("")}</div>
          <span class="aud-h" style="display:block;margin-top:20px">Aparelho</span>
          <div class="aud-big">${fmtP(A.device[0][1])}</div><span class="aud-s">no Android · ${fmtP(A.device[1][1])} no iPhone</span></div>
        <div><span class="aud-h">Plataforma</span>${bars(A.plat,A.plat[0][1])}</div>
      </div>
      ${more(`<span class="aud-h">Onde o anúncio apareceu</span>${bars(A.place,A.place[0][1])}<ul class="notes" style="margin-top:16px">${A.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`,"Ver onde apareceu")}
    </div>
  </section>

  <section class="sec" id="google">${eyebrow("Google Ads")}
    <h2 class="sec-h">17 ligações no primeiro mês completo</h2>
    <p class="sec-lede">Performance Max: o anúncio aparece na busca, no Maps, no YouTube e em sites parceiros, e é otimizado para ligação e rota até a empresa.</p>
    <div class="grid g-12">${G.kpis.map((k,i)=>`<div class="card kpi s-3 ${i===0?"glow":""}">
      <div class="k-l">${k.l}</div><div class="k-v">${k.v}</div>
      <div class="k-row">${k.dir==="flat"?dN(k.d):delta(k.d,k.dir)}<span>${k.s}</span></div></div>`).join("")}</div>
    <div class="grid g-12">
      <div class="card s-5">
        <div class="card-h"><span class="icobox">${ICON.target}</span><h3>Do anúncio à ligação</h3></div>
        <div class="gfun">${G.funnel.map(([l,v,p],i)=>`<div class="gf"><div class="gf-b" style="width:${[100,62,30][i]}%"><span class="v">${fmtN(v)}</span></div><div class="gf-l"><b>${l}</b>${p?`<span>${p}</span>`:""}</div></div>`).join("")}</div>
        <p class="card-sub" style="margin-top:14px">Além das ligações, 13 pessoas pediram ao Google a rota até o endereço.</p>
      </div>
      <div class="card s-7">
        <div class="card-h"><span class="icobox">${ICON.chart}</span><h3>Ligações por dia</h3></div>
        <p class="card-sub">${esc(G.callsNote)}</p>
        <div class="chart" id="chCalls"></div>
      </div>
    </div>
    <div style="margin-top:6px">${more(`<p class="card-sub" style="max-width:90ch">${esc(G.more)}</p>`,"Por que o custo por clique subiu")}</div>
  </section>

  <section class="sec" id="plano">${eyebrow("Plano de ação")}
    <h2 class="sec-h">Os pontos de atenção já têm ação definida</h2>
    <div class="grid g-12">
      <div class="card s-5"><div class="card-h"><h3>O que já funciona</h3></div><ul class="lst ok">${P.working.map(t=>`<li><span class="mk">${ICON.check}</span><span>${esc(t)}</span></li>`).join("")}</ul></div>
      <div class="card s-7"><div class="card-h"><h3>Pontos de atenção e o que estamos fazendo</h3></div>
        <ul class="att">${P.attention.map(t=>`<li><span class="att-p">${esc(t.b)}</span><span class="att-a">${ICON.arrowR}${esc(t.a)}</span></li>`).join("")}</ul></div>
    </div>
    <div class="actions ${P.actions.length%2===0?"even":""}">${P.actions.map((r,i)=>`<div class="card act ${i===0?"glow":""}"><span class="num">${String(i+1).padStart(2,"0")}</span><div class="act-b"><h3>${esc(r.t)}</h3><p>${esc(r.b)}</p>${more(`<p class="why">${esc(r.w)}</p>`,"Por quê")}</div></div>`).join("")}</div>
  </section>

  <footer class="foot"><span><b style="color:var(--fg-2);font-weight:500">Fonte:</b> ${esc(D.source)}</span><span>Setembro: ${D.range} · Agosto: ${D.prevRange}</span></footer>
  </div>`;
}

function viewEmpty(s){
  chartJobs=[];
  const plans={
    instagram:["Visão geral do mês contra o anterior","Crescimento de seguidores e perfil do público","Engajamento por formato","Top e baixo desempenho","Diagnóstico, recomendações e roteiros"],
    ads:["Investimento, alcance e frequência por campanha","Custo por visita ao perfil e por ThruPlay","Comparativo Meta Ads × Google Ads","Ranking de anúncios e otimizações","Pontos de atenção e plano de ação"],
    work:["Entregas do mês por marca","Calendário editorial: publicado × planejado","Produção de vídeo, design e copy","Destaques e resultados do período","Próximos passos"]
  }[s.kind];
  const titles={instagram:`Redes sociais da <em>${s.name}</em>`,ads:`Tráfego pago da <em>Impacto Fire</em>`,work:`<em>Marketing global</em> do Grupo Master`};
  const ledes={instagram:"O primeiro relatório desta conta ainda não foi publicado. Assim que chegar, ele aparece aqui no mesmo formato do relatório da Pratique.",ads:"Campanhas de Meta Ads e Google Ads. O primeiro relatório ainda não foi publicado aqui.",work:"Um resumo mensal da produção e da gestão de conteúdo nas três marcas. O primeiro relatório ainda não foi publicado."};
  return hero(s,null,titles[s.kind],ledes[s.kind])+`<div class="wrap">
    <div class="empty">
      <div class="card glass orb">
        <span class="ring g" style="width:230px;height:230px"></span><span class="ring" style="width:160px;height:160px"></span><span class="ring" style="width:300px;height:300px;opacity:.5"></span>
        <span class="sat" style="transform:translate(115px,0)"></span><span class="sat" style="transform:translate(-80px,-58px)"></span><span class="sat" style="transform:translate(-50px,140px);opacity:.6"></span>
        <span class="core"><img src="${s.icon}" alt=""></span>
      </div>
      <div class="card">
        <div class="card-h"><span class="icobox">${ICON.file}</span><h3>O que vai aparecer aqui</h3></div>
        <ul class="lst ok">${plans.map(p=>`<li><span class="mk">${ICON.check}</span><span>${p}</span></li>`).join("")}</ul>
        <p class="card-sub" style="margin-top:18px">Cada mês ganha um botão próprio no seletor acima, com o PDF do relatório para baixar.</p>
      </div>
    </div></div>`;
}

function viewOverview(s){
  chartJobs=[];
  const accts=SECTIONS.filter(x=>x.kind==="instagram");
  const withData=accts.filter(a=>latest(a));
  const card=a=>{const mk=latest(a), D=mk?a.months[mk]:null;
    const kp=l=>D.kpis.find(x=>x.l.startsWith(l));
    return `<button class="card acc s-4" data-go="${a.id}" style="--a1:${BRAND_GLOW[a.brand]};--grad:${BRAND_GRAD[a.brand]}">
      <div class="top"><img src="${a.logo}" alt="${a.name}"><span class="status ${D?"on":""}"><i></i>${D?monthShort(mk):"Aguardando"}</span></div>
      ${D?`<div class="mini">
        ${D.summary.map(x=>`<div class="mm"><div class="mm-v"><span class="v">${x.v}</span>${x.d?delta(x.d,x.dir||"up"):""}</div><div class="l">${x.l}</div></div>`).join("")}
      </div>`:`<p class="wait">O primeiro relatório desta conta ainda não foi publicado.</p>`}
      <span class="card-sub" style="font-size:12.5px;color:var(--fg-2)">${D?"Abrir relatório →":"Ver seção →"}</span></button>`;};
  const insights = withData.map(a=>{const D=a.months[latest(a)], P=D.plan.actions[0];return `<div class="pr" style="--g:${BRAND_GRAD[a.brand]};--gl:${BRAND_GLOW[a.brand]}"><div class="pr-h"><span class="br-ico"><img src="${a.icon}" alt=""></span><b>${a.name}</b><span>${D.label}</span></div><h4>${esc(P.t)}</h4><p>${esc(P.b)}</p></div>`;}).join("");
  return hero(s,null,`As redes sociais do <em style="white-space:nowrap">Grupo Master</em> em um só lugar`,`Resumo do último relatório publicado de cada conta. ${withData.length} de ${accts.length} contas com dados até agora.`)+
  `<div class="wrap"><section class="sec">${eyebrow("Redes sociais")}
    <h2 class="sec-h">Último mês de cada conta</h2>
    <div class="grid g-12">${accts.map(card).join("")}</div>
    ${withData.length?`<div class="card" style="margin-top:14px"><div class="card-h"><span class="icobox">${ICON.spark}</span><h3>Prioridades em aberto</h3></div><div class="prio">${insights}</div></div>`:""}
  </section>
  <section class="sec">${eyebrow("Outros relatórios")}
    <div class="grid g-12">
      ${SECTIONS.filter(x=>x.kind==="ads"||x.kind==="work").map(x=>`<button class="card acc s-6" data-go="${x.id}" style="--a1:${BRAND_GLOW[x.brand]};--grad:${BRAND_GRAD[x.brand]}"><div class="top"><div class="card-h" style="margin:0"><span class="icobox"><img src="${x.icon}" alt="" style="width:14px"></span><h3>${x.kind==="ads"?"Tráfego pago · Impacto Fire":"Marketing global"}</h3></div><span class="status ${latest(x)?"on":""}"><i></i>${latest(x)?monthShort(latest(x)):"Aguardando"}</span></div><p class="card-sub">${!latest(x)?x.sub:x.kind==="work"?x.months[latest(x)].highlights.map(h=>h.v+" "+h.l).slice(0,3).join(" · "):x.months[latest(x)].summary.map(m=>m.v+" "+m.l).join(" · ")}</p></button>`).join("")}
    </div></section></div>`;
}

render();
</script>
</body>
